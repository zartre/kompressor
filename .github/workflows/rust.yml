name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_HOME: ~/.cargo
  CARGO_TERM_COLOR: always

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --verbose --target x86_64-pc-windows-msvc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kompressor-windows
          path: target/x86_64-pc-windows-msvc/release/*.exe

  build_mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Write cert
        env:
          BUNDLE_CERT_BASE64: ${{ secrets.BUNDLE_CERT_BASE64 }}
          LC_CTYPE: C
        run: |
          mkdir secrets
          echo $BUNDLE_CERT_BASE64 | base64 -d > secrets/kompressor.p12

      - name: Build
        run: cargo build --release --verbose --target aarch64-apple-darwin

      - name: Bundle
        env:
          APPLE_SIGNING_PASSWORD: ${{ secrets.APPLE_SIGNING_PASSWORD }}
        run: cargo bundle --release --binary-path target/aarch64-apple-darwin/release/kompressor

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kompressor-mac
          path: target/aarch64-apple-darwin/release/bundle/dmg/Kompressor.dmg

